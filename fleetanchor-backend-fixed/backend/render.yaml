services:
  - type: web
    name: anchor-fleetpro
    runtime: node
    region: oregon
    plan: free
    rootDir: fleetanchor-backend-fixed/backend
    buildCommand: npm install --legacy-peer-deps && npm install --save-exact prisma@5.10.2 @prisma/client@5.10.2 && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
