name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleetanchor-backend-fixed/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fleetanchor-backend-fixed/backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate database schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: No undefined names
        run: npx --yes eslint@8 src test
      - name: Every query matches the schema
        run: |
          npm i --no-save espree@9 @prisma/prisma-schema-wasm@5.10.0-34.5a9203d0590c951969e85a7d07215503f4672eb9
          node test/prisma-fields.check.js
      - name: Security tests
        run: npm test

  web:
    name: Web app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleetanchor-frontend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fleetanchor-frontend/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
