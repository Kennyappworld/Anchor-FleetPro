# Used when a host (e.g. Railway) builds from the repository root.
# The API lives in fleetanchor-backend-fixed/backend.
[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["cd fleetanchor-backend-fixed/backend && npm ci"]

[phases.build]
cmds = ["cd fleetanchor-backend-fixed/backend && npm run build"]

[start]
# db:sync stops instead of deleting data if the schema change is destructive.
cmd = "cd fleetanchor-backend-fixed/backend && npm run db:sync && npm start"

[variables]
NODE_ENV = "production"
